services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: narrative
      POSTGRES_USER: narrative
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment before starting PostgreSQL}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
